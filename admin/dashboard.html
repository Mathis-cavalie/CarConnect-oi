<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CarConnect OI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-primary: #dc3030;
            --red-dark: #b82424;
            --text-white: #14141a;
            --text-body: #5d5d69;
            --text-muted: #9a9aa5;
            --bg-body: #f7f7f9;
            --bg-card: #ffffff;
            --border-card: rgba(0,0,0,0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-body); color: var(--text-white); }

        .dashboard { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-card);
            padding: 24px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-card);
            margin-bottom: 24px;
        }
        .sidebar-logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--red-primary), #ff4444);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .sidebar-logo svg {
            width: 28px; height: 28px;
            color: white;
        }
        .sidebar-title { font-size: 1.1rem; font-weight: 700; }
        .sidebar-subtitle { font-size: 0.8rem; color: var(--text-muted); }

        .nav-menu { list-style: none; }
        .nav-item { margin-bottom: 4px; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-body);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(220,48,48,0.08);
            color: var(--red-primary);
        }
        .nav-link svg { width: 20px; height: 20px; }

        .logout-btn {
            margin-top: auto;
            padding: 12px 16px;
            background: rgba(220,48,48,0.1);
            color: var(--red-primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: rgba(220,48,48,0.15);
        }

        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 32px 48px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .header-title h1 { font-size: 1.8rem; font-weight: 700; color: #14141a; }
        .header-title p { color: var(--text-muted); margin-top: 4px; }

        .btn-add {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            background: var(--red-primary);
            color: white;
            border: none;
            border-radius: 99px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-add:hover {
            background: var(--red-dark);
            box-shadow: 0 8px 24px rgba(220,48,48,0.3);
            transform: translateY(-2px);
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-card);
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .stat-icon svg {
            width: 24px; height: 24px;
        }
        .stat-icon.red { background: rgba(220,48,48,0.1); }
        .stat-icon.blue { background: rgba(59,130,246,0.1); }
        .stat-icon.green { background: rgba(34,197,94,0.1); }
        .stat-icon.purple { background: rgba(139,92,246,0.1); }

        .stat-value { font-size: 2rem; font-weight: 700; color: #14141a; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        /* Filters */
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 99px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-body);
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--red-primary);
            color: white;
            border-color: var(--red-primary);
        }

        /* Vehicles grid */
        .vehicles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }
        .vehicle-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-card);
            transition: all 0.3s;
        }
        .vehicle-card:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }
        .vehicle-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .vehicle-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            background: var(--red-primary);
            color: white;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .vehicle-info { padding: 20px; }
        .vehicle-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .vehicle-meta {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .vehicle-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--red-primary);
        }
        .vehicle-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit {
            background: rgba(59,130,246,0.1);
            color: #3b82f6;
            border: 1px solid rgba(59,130,246,0.2);
        }
        .btn-edit:hover { background: rgba(59,130,246,0.15); }
        .btn-delete {
            background: rgba(220,48,48,0.1);
            color: var(--red-primary);
            border: 1px solid rgba(220,48,48,0.2);
        }
        .btn-delete:hover { background: rgba(220,48,48,0.15); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }

        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C-.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                </div>
                <div>
                    <div class="sidebar-title">CarConnect OI</div>
                    <div class="sidebar-subtitle">Administration</div>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/admin/dashboard" class="nav-link active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/vehicles" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C-.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                        Véhicules
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/motos" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M5 17h2v-6h4v6h2"/><path d="M9 6h6"/><path d="M12 3v3"/></svg>
                        Motos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/contacts" class="nav-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        Messages
                    </a>
                </li>
            </ul>

            <button class="logout-btn" id="logoutBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Déconnexion
            </button>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <div class="header-bar">
                <div class="header-title">
                    <h1>Tableau de bord</h1>
                    <p>Gérez votre catalogue de véhicules et motos</p>
                </div>
                <a href="/admin/vehicle-form" class="btn-add">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Ajouter un véhicule
                </a>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon red">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C-.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                    </div>
                    <div class="stat-value" id="statVoitures">0</div>
                    <div class="stat-label">Voitures</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M5 17h2v-6h4v6h2"/><path d="M9 6h6"/><path d="M12 3v3"/></svg>
                    </div>
                    <div class="stat-value" id="statMotos">0</div>
                    <div class="stat-label">Motos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <div class="stat-value" id="statDisponibles">0</div>
                    <div class="stat-label">Disponibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="stat-value" id="statMessages">0</div>
                    <div class="stat-label">Nouveaux messages</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="voiture">Voitures</button>
                <button class="filter-btn" data-filter="moto">Motos</button>
                <button class="filter-btn" data-filter="featured">En vedette</button>
            </div>

            <!-- Vehicles grid -->
            <div class="vehicles-grid" id="vehiclesGrid">
                <!-- Chargement... -->
                <div style="text-align:center;padding:60px 20px;color:#9a9aa5;grid-column:1/-1;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:16px;opacity:0.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    <div>Chargement des véhicules...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Vérifier l'authentification
        fetch('/api/auth/check', { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = '/admin';
                }
            });

        // Charger les véhicules
        let allVehicles = [];

        async function loadVehicles() {
            try {
                const res = await fetch('/api/vehicles');
                const vehicles = await res.json();
                allVehicles = vehicles;
                renderVehicles(vehicles);
                updateStats(vehicles);
            } catch (error) {
                console.error('Erreur:', error);
            }
        }

        function renderVehicles(vehicles) {
            const grid = document.getElementById('vehiclesGrid');
            
            if (vehicles.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.3.3-1.8.7C4.3 8.6 3 10 3 10s-2.7.6-4.5 1.1C-.7 11.3 0 12.1 0 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                        </div>
                        <h3>Aucun véhicule</h3>
                        <p>Commencez par ajouter votre premier véhicule</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = vehicles.map(v => `
                <div class="vehicle-card">
                    <div style="position: relative;">
                        <img src="${v.image_principale || '/assets/placeholder-vehicle.jpg'}" 
                             alt="${v.marque} ${v.modele}" 
                             class="vehicle-image"
                             onerror="this.src='https://via.placeholder.com/400x220?text=Pas+d%27image'">
                        ${v.featured ? '<span class="vehicle-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:middle;margin-right:4px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Vedette</span>' : ''}
                        ${!v.disponible ? '<span class="vehicle-badge" style="background:#6b7280;">Vendu</span>' : ''}
                    </div>
                    <div class="vehicle-info">
                        <h3 class="vehicle-title">${v.marque} ${v.modele}</h3>
                        <div class="vehicle-meta">
                            <span>${v.annee}</span>
                            <span>•</span>
                            <span>${v.kilometrage ? v.kilometrage.toLocaleString() + ' km' : 'N/A'}</span>
                            <span>•</span>
                            <span>${v.carburant || 'N/A'}</span>
                        </div>
                        <div class="vehicle-price">${v.prix.toLocaleString()} €</div>
                        <div class="vehicle-actions">
                            <a href="/admin/vehicle-form?id=${v.id}" class="btn-action btn-edit">Modifier</a>
                            <button class="btn-action btn-delete" onclick="deleteVehicle(${v.id})">Supprimer</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(vehicles) {
            const voitures = vehicles.filter(v => v.type === 'voiture').length;
            const motos = vehicles.filter(v => v.type === 'moto').length;
            const disponibles = vehicles.filter(v => v.disponible).length;
            
            document.getElementById('statVoitures').textContent = voitures;
            document.getElementById('statMotos').textContent = motos;
            document.getElementById('statDisponibles').textContent = disponibles;
            document.getElementById('statMessages').textContent = '0'; // À implémenter
        }

        // Filtres
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                let filtered = allVehicles;
                
                if (filter === 'voiture') filtered = allVehicles.filter(v => v.type === 'voiture');
                else if (filter === 'moto') filtered = allVehicles.filter(v => v.type === 'moto');
                else if (filter === 'featured') filtered = allVehicles.filter(v => v.featured);
                
                renderVehicles(filtered);
            });
        });

        // Suppression
        async function deleteVehicle(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce véhicule ?')) return;
            
            try {
                const res = await fetch(`/api/vehicles/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (res.ok) {
                    loadVehicles();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (error) {
                alert('Erreur lors de la suppression');
            }
        }

        // Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = '/admin';
        });

        // Initialisation
        loadVehicles();
    </script>
</body>
</html>
